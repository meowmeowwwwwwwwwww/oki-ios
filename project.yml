# Oki for iPhone. GitHub builds it (xcodegen + xcodebuild, see .github/workflows/build.yml) without signing;
# SideStore on the phone signs it with Даша's free Apple ID.
name: Oki
options:
  bundleIdPrefix: io.github.meowmeowwwwwwwwwww
  deploymentTarget:
    iOS: "17.0"
targets:
  Oki:
    type: application
    platform: iOS
    sources: [Oki]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meowmeowwwwwwwwwww.oki
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Oki/Info.plist
      properties:
        CFBundleDisplayName: Oki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Mist
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: true
        WKAppBoundDomains: [meowmeowwwwwwwwwww.github.io]
